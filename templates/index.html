<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PdfShift</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;color:#172331;background:#f3f6f8;margin:0}.wrap{max-width:850px;margin:48px auto;padding:28px;background:white;border-radius:14px;box-shadow:0 8px 30px #19334a12}h1{margin-top:0}button,.pick{background:#126b57;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}.pick input{display:none}button:disabled{opacity:.5}#preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:20px 0}img{width:100%;border:1px solid #ccd4d9}.note{padding:12px;background:#fff6da;border-radius:8px}.hidden{display:none}#status{margin-top:14px;white-space:pre-wrap}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main class="wrap"><h1>PdfShift</h1><p>Envie um PDF de até 20 MB. Confira a prévia antes de aprovar a conversão.</p>
<div class="actions"><label class="pick">Escolher PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><span id="size"></span></div><div id="notice" class="note hidden"></div><div id="preview"></div>
<div class="actions"><button id="approve" disabled>Aprovar e baixar PDF A4</button><button id="cancel" class="hidden">Cancelar</button></div><div id="status" role="status" aria-live="polite"></div></main>
<script>
let job=null;const file=document.querySelector('#file'),approve=document.querySelector('#approve'),cancel=document.querySelector('#cancel'),status=document.querySelector('#status'),notice=document.querySelector('#notice');
file.onchange=async()=>{job=null;approve.disabled=true;cancel.classList.add('hidden');document.querySelector('#preview').replaceChildren();notice.classList.add('hidden');const f=file.files[0];if(!f)return;document.querySelector('#size').textContent=`${(f.size/1048576).toFixed(2)} MB`;if(f.size>20*1048576){const m='Olá, preciso de ajuda para converter um PDF para A4. O arquivo excede 20 MB. Podem revisar?';notice.innerHTML=`Arquivo acima de 20 MB. Não foi processado. <a href="https://wa.me/55984190295?text=${encodeURIComponent(m)}">Preparar mensagem no WhatsApp</a>.`;notice.classList.remove('hidden');return}status.textContent='Gerando prévia…';const data=new FormData();data.append('pdf',f);try{const r=await fetch('api/preview',{method:'POST',body:data});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao gerar a prévia');job=d.job;notice.textContent=d.message;notice.classList.remove('hidden');d.pages.forEach(src=>{const img=document.createElement('img');img.src=src;img.alt='Prévia de uma página do PDF';document.querySelector('#preview').append(img)});approve.disabled=false;cancel.classList.remove('hidden');status.textContent=`${d.page_count} página(s).`;}catch(e){status.textContent=e.message}};
approve.onclick=async()=>{if(!job)return;approve.disabled=true;status.textContent='Convertendo…';try{const r=await fetch(`api/convert/${encodeURIComponent(job)}`,{method:'POST'});if(!r.ok)throw Error('A conversão expirou. Envie o arquivo novamente.');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='documento_A4.pdf';a.click();URL.revokeObjectURL(a.href);status.textContent='PDF A4 baixado.';job=null;cancel.classList.add('hidden')}catch(e){status.textContent=e.message;approve.disabled=false}};
cancel.onclick=()=>{job=null;approve.disabled=true;cancel.classList.add('hidden');document.querySelector('#preview').replaceChildren();notice.classList.add('hidden');status.textContent='Conversão cancelada.'};
</script></body></html>
